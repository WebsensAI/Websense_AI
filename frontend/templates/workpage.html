<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Analyzer | WebSense AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../static/css/global.css">

<link rel="stylesheet" href="../static/css/workpage.css">

</head>

<body>

<div class="work-container">

    <h1>Website Analyzer</h1>

    <p>Enter any website URL to begin the AI audit.</p>

    <div class="input-box">

        <input
            type="url"
            id="websiteURL"
            placeholder="https://example.com">

        <button id="analyzeBtn">

            Analyze Website

        </button>

    </div>

    <div class="loading-section">

        <h2>Analysis Progress</h2>

        <div class="progress-bar">

            <div class="progress-fill"></div>

        </div>

        <div class="status">

            <p id="statusText">

                Waiting to start...

            </p>

        </div>

    </div>

    <div class="results">

        <div class="result-card">

            <h3>SEO</h3>

            <h2 id="seoScore">0%</h2>

        </div>

        <div class="result-card">

            <h3>Security</h3>

            <h2 id="securityScore">0%</h2>

        </div>

        <div class="result-card">

            <h3>Accessibility</h3>

            <h2 id="accessibilityScore">0%</h2>

        </div>

        <div class="result-card">

            <h3>Performance</h3>

            <h2 id="performanceScore">0%</h2>

        </div>

    </div>

</div>

<script src="../static/js/workpage.js"></script>

</body>

</html>
