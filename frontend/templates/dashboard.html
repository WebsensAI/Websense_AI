<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | WebSense AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/global.css">

<link rel="stylesheet" href="/static/css/dashboard.css">

</head>

<body>

<nav class="dashboard-nav">

    <h2>WebSense AI</h2>

    <ul>

        <li><a href="/workpage">Analyze</a></li>

        <li id="logoutBtn" style="cursor:pointer">Logout</li>

    </ul>

</nav>

<section class="dashboard">

    <h1>Welcome Back, {{ user_name }} 👋</h1>

    <p>Ready to analyze another website?</p>

    <div class="cards">

        <div class="card">

            <h2>12</h2>

            <p>Total Scans</p>

        </div>

        <div class="card">

            <h2>98%</h2>

            <p>Success Rate</p>

        </div>

        <div class="card">

            <h2>10</h2>

            <p>AI Reports</p>

        </div>

    </div>

    <div class="activity">

        <h2>Recent Activity</h2>

        <table>

            <tr>

                <th>Website</th>

                <th>Status</th>

                <th>Date</th>

            </tr>

            <tr>

                <td>example.com</td>

                <td>Completed</td>

                <td>21 Jul</td>

            </tr>

            <tr>

                <td>google.com</td>

                <td>Completed</td>

                <td>20 Jul</td>

            </tr>

            <tr>

                <td>amazon.in</td>

                <td>Completed</td>

                <td>19 Jul</td>

            </tr>

        </table>

    </div>

    <a href="/workpage" class="hero-btn">

        New Website Analysis

    </a>

</section>

<script src="/static/js/dashboard.js"></script>

</body>

</html>
